Text=SELECT \n    COUNT(*) AS QUANTIDADE\nFROM transacao t\nJOIN nfe n ON t.trn_id = n.trn_id\nWHERE n.situacao = 8\n  AND t.trn_datvda BETWEEN :DATA_INICIAL AND :DATA_FINAL;

