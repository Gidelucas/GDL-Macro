[off0]
Text=SET TERM ^ ;\n\nCREATE OR ALTER procedure PROC_CORRIGE_DHCONT (\n    P_DATA_INI date,\n    P_DATA_FIM date)\nas\ndeclare variable V_ID integer;\ndeclare variable V_XML blob sub_type 1 segment size 80;\ndeclare variable V_XML_NOVO blob sub_type 1 segment size 80;\ndeclare variable V_DHEMI varchar(50);\ndeclare variable V_TAG_ANTIGA varchar(100);\ndeclare variable POS_INI integer;\ndeclare variable POS_FIM integer;\nBEGIN\n\n  FOR\n      SELECT\n          n.id,\n          n.xml\n      FROM transacao t\n      JOIN nfe n ON t.trn_id = n.trn_id\n      WHERE n.situacao = 8\n        AND t.trn_datvda BETWEEN :P_DATA_INI AND :P_DATA_FIM\n  INTO\n      :V_ID,\n      :V_XML\n  DO\n  BEGIN\n\n      POS_INI =\n          POSITION('<dhEmi>' IN V_XML)\n          + CHAR_LENGTH('<dhEmi>');\n\n      POS_FIM =\n          POSITION('</dhEmi>' IN V_XML);\n\n      V_DHEMI =\n          SUBSTRING(\n              V_XML\n              FROM POS_INI\n              FOR POS_FIM - POS_INI\n          );\n\n      POS_INI =\n          POSITION('<dhCont>' IN V_XML);\n\n      POS_FIM =\n          POSITION('</dhCont>' IN V_XML)\n          + CHAR_LENGTH('</dhCont>') - 1;\n\n      V_TAG_ANTIGA =\n          SUBSTRING(\n              V_XML\n              FROM POS_INI\n              FOR POS_FIM - POS_INI + 1\n          );\n\n      V_XML_NOVO =\n          REPLACE(\n              V_XML,\n              V_TAG_ANTIGA,\n              '<dhCont>' || V_DHEMI || '</dhCont>'\n          );\n\n      UPDATE NFE\n         SET XML = :V_XML_NOVO\n       WHERE ID = :V_ID;\n\n  END\n\nEND^\n\nSET TERM ; ^

